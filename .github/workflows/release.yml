name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate release tag
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          node --input-type=module -e '
            import { readFileSync } from "node:fs";
            const { version } = JSON.parse(readFileSync("system.json", "utf8"));
            const tagVersion = process.env.RELEASE_TAG.replace(/^v/, "");
            if (version !== tagVersion) {
              console.error(`Tag ${process.env.RELEASE_TAG} does not match manifest version ${version}`);
              process.exit(1);
            }
          '

      - name: Package system
        run: git archive --format=zip --output=dungeon-crawler-carl.zip "$GITHUB_SHA" system.json index.mjs module styles templates lang assets

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dungeon-crawler-carl.zip --verify-tag --generate-notes --title "Dungeon Crawler Carl $GITHUB_REF_NAME"
